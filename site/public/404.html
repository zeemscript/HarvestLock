<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b120f" />
    <meta
      name="description"
      content="The HarvestLock page you requested could not be found."
    />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Page not found — HarvestLock</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0b120f;
        color: #f3f1e9;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(ellipse at 50% 0%, rgb(30 107 78 / 18%), transparent 55%),
          #0b120f;
      }

      main { width: min(100%, 620px); }

      .eyebrow {
        margin: 0 0 18px;
        color: #eec765;
        font: 500 0.78rem/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font: 500 clamp(3rem, 11vw, 6rem)/0.98 Georgia, "Times New Roman", serif;
        letter-spacing: -0.035em;
      }

      p {
        max-width: 42ch;
        margin: 24px 0 0;
        color: #c9c6ba;
        font-size: 1.08rem;
        line-height: 1.7;
      }

      nav { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 32px; }

      a {
        min-height: 48px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0 18px;
        border: 1px solid #23302a;
        border-radius: 3px;
        color: #f3f1e9;
        font-weight: 600;
        text-decoration: none;
      }

      a:first-child { border-color: #d4a937; background: #d4a937; color: #0b120f; }
      a:hover { border-color: #eec765; }
      a:focus-visible { outline: 2px solid #eec765; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">HarvestLock · Stellar testnet prototype</p>
      <h1>That page isn’t here.</h1>
      <p>
        The link may be outdated, or the address may have a typo. Head back to
        the HarvestLock overview or visit the project on GitHub.
      </p>
      <nav aria-label="Helpful links">
        <a href="/">Back to HarvestLock</a>
        <a href="https://github.com/Agrisettle/HarvestLock">Project on GitHub</a>
      </nav>
    </main>
  </body>
</html>
